```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .welcome {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .logout-btn {
            display: inline-block;
            padding: 13px 35px;
            background: #e74c3c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .welcome {
                font-size: 14px;
            }

            .logout-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            A
        </div>

        <h1>Welcome, {{ user.first_name }}!</h1>

        <p class="welcome">
            You have successfully signed in to your account.
        </p>

        <a href="{% url 'logout' %}" class="logout-btn">
            Logout
        </a>

    </div>

</body>
</html>
```
