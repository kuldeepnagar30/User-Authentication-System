<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - AuthSystem</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signin-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .signin-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.25);
        }

        .signin-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .signin-btn:hover {
            background: #5568d9;
        }

        .signup-text {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .signup-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #777;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home:hover {
            color: #667eea;
        }

        /* Mobile Responsive */
        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .signin-container {
                padding: 30px 20px;
            }

            .signin-container h1 {
                font-size: 26px;
            }

            .form-group input {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="signin-container">

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Sign in to your account
        </p>

        <form method="POST" action="{% url 'signin' %}" >
            {% csrf_token %}
            {% if success %}
            <p style="color: green;text-align: center;">{{success}}</p>
            {% endif %}
            {% if invalid %}
            <p style="color: red;text-align: center;">{{invalid}}</p>
            {% endif %}

            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <!-- Sign In Button -->
            <button type="submit" class="signin-btn">
                Sign In
            </button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="signup">Sign Up</a>
        </p>

        <a href="#" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
